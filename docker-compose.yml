# Nota: la clave "version" es obsoleta en Docker Compose v2 y se eliminó.

networks:
  itinerarios-net:
    driver: bridge

volumes:
  postgres-airport-data:
  postgres-itinerary-data:
  postgres-notification-data:
  localstack-data:

services:

  postgres-airport:
    image: postgres:16-alpine
    container_name: postgres-airport
    environment:
      POSTGRES_DB: airport_db
      POSTGRES_USER: ${AIRPORT_DB_USER:-airport_user}
      POSTGRES_PASSWORD: ${AIRPORT_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-airport-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRPORT_DB_USER:-airport_user} -d airport_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - itinerarios-net

  postgres-itinerary:
    image: postgres:16-alpine
    container_name: postgres-itinerary
    environment:
      POSTGRES_DB: itinerary_db
      POSTGRES_USER: ${ITINERARY_DB_USER:-itinerary_user}
      POSTGRES_PASSWORD: ${ITINERARY_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres-itinerary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITINERARY_DB_USER:-itinerary_user} -d itinerary_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - itinerarios-net

  redis:
    # NOTA: no se pudo confirmar la última versión estable exacta desde este
    # entorno (búsqueda sin resultado claro). redis:7-alpine es una etiqueta
    # estable y ampliamente usada al momento de escribir esto; verificar si
    # existe una línea mayor más reciente (Redis 8.x) antes de fijarla en
    # un entorno real.
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - itinerarios-net

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest por defecto)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - itinerarios-net

  jaeger:
    image: jaegertracing/all-in-one:1.76.0 # ultima linea v1 (tag con parche: "1.62" no existe en Docker Hub)
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
    networks:
      - itinerarios-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (lo usan los 4 microservicios backend)
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger
    networks:
      - itinerarios-net

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    networks:
      - itinerarios-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - itinerarios-net

  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification_user}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-notification_user} -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - itinerarios-net

  # LocalStack (secciones 31-32, 39-40, Nivel 2): simulación local de AWS Lambda
  # para Notification. Va en el perfil "serverless" para no frenar el stack
  # principal: `docker compose --profile serverless up -d localstack`.
  # Se fija la línea 4.0 de la imagen comunitaria (sin suscripción, sección 104);
  # LOCALSTACK_AUTH_TOKEN es opcional y solo aplica si el equipo decide usar una
  # versión que lo exija. Ver ADR-015.
  localstack:
    image: localstack/localstack:4.0
    container_name: localstack
    profiles: ["serverless"]
    environment:
      SERVICES: lambda,logs,iam,sts,s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      # Los contenedores de la Lambda se unen a la red del stack para llegar a postgres-notification.
      LAMBDA_DOCKER_NETWORK: itinerarios-infrastructure_itinerarios-net
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - itinerarios-net

  # Keycloak (paso 31, seguridad S2S, seccion 108): emite JWT con OAuth2 Client Credentials.
  # SOLO DESARROLLO: start-dev con base embebida y secretos de desarrollo por defecto (decision del
  # usuario: en local se queman para que funcione sin configurar nada). .env puede sobrescribirlos.
  # Produccion (AWS) usa modo start + PostgreSQL en RDS y secretos en SSM: ver aws/cloudformation/05-ecs.yaml.
  # Consola admin local: http://localhost:8180 (admin / admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Hostname dinamico: el navegador entra por el nginx del frontend (localhost:4200/realms/...) y los
      # servicios por keycloak:8080; los tokens de servicio siguen llevando iss=http://keycloak:8080/...
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:-dev-gateway-secret}
      ITINERARY_CLIENT_SECRET: ${ITINERARY_CLIENT_SECRET:-dev-itinerary-secret}
      # Usuario de prueba (se crea en cada arranque al importar el realm). El correo real va en .env.
      TEST_USER_EMAIL: ${TEST_USER_EMAIL:-tester@itinerarios.local}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-tester-dev}
      TEST_USER_FIRST_NAME: ${TEST_USER_FIRST_NAME:-Tester}
      # Usuario tecnico de Selenium (contrasena no temporal).
      E2E_USER_PASSWORD: ${E2E_USER_PASSWORD:-e2e-dev}
    volumes:
      - ./keycloak/itinerarios-realm.json:/opt/keycloak/data/import/itinerarios-realm.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready (puerto de management 9000) con bash.
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q UP <&3']
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - itinerarios-net

  airport-service:
    build:
      context: ../itinerarios-airport-service
    container_name: airport-service
    environment:
      DB_HOST: postgres-airport
      DB_PORT: 5432
      DB_NAME: airport_db
      DB_USERNAME: ${AIRPORT_DB_USER:-airport_user}
      DB_PASSWORD: ${AIRPORT_DB_PASSWORD}
      COLOMBIA_API_BASE_URL: ${COLOMBIA_API_BASE_URL:-https://api-colombia.com/api/v1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OAUTH2_ISSUER_URI: http://keycloak:8080/realms/itinerarios
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: airport-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none # las métricas van por Micrometer -> Prometheus, no por OTel, para no duplicar pipelines
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8081:8081"
    depends_on:
      postgres-airport:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - itinerarios-net

  itinerary-service:
    build:
      context: ../itinerarios-itinerary-service
    container_name: itinerary-service
    environment:
      DB_HOST: postgres-itinerary
      DB_PORT: 5432
      DB_NAME: itinerary_db
      DB_USERNAME: ${ITINERARY_DB_USER:-itinerary_user}
      DB_PASSWORD: ${ITINERARY_DB_PASSWORD}
      AIRPORT_SERVICE_URL: http://airport-service:8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      OAUTH2_ISSUER_URI: http://keycloak:8080/realms/itinerarios
      OAUTH2_TOKEN_URI: http://keycloak:8080/realms/itinerarios/protocol/openid-connect/token
      OAUTH2_CLIENT_SECRET: ${ITINERARY_CLIENT_SECRET:-dev-itinerary-secret}
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: itinerary-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8082:8082"
    depends_on:
      postgres-itinerary:
        condition: service_healthy
      airport-service:
        condition: service_started
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - itinerarios-net

  notification-service:
    build:
      context: ../itinerarios-notification
    container_name: notification-service
    environment:
      DB_HOST: postgres-notification
      DB_PORT: 5432
      DB_NAME: notification_db
      DB_USERNAME: ${NOTIFICATION_DB_USER:-notification_user}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      OAUTH2_ISSUER_URI: http://keycloak:8080/realms/itinerarios
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8083:8083"
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - itinerarios-net

  gateway:
    build:
      context: ../itinerarios-gateway
    container_name: gateway
    environment:
      AIRPORT_SERVICE_URL: http://airport-service:8081
      ITINERARY_SERVICE_URL: http://itinerary-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      OAUTH2_TOKEN_URI: http://keycloak:8080/realms/itinerarios/protocol/openid-connect/token
      OAUTH2_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:-dev-gateway-secret}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8080:8080"
    depends_on:
      airport-service:
        condition: service_started
      itinerary-service:
        condition: service_started
      notification-service:
        condition: service_started
      otel-collector:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - itinerarios-net

  frontend:
    build:
      context: ../itinerarios-frontend
    container_name: frontend
    environment:
      GATEWAY_UPSTREAM: http://gateway:8080
      KEYCLOAK_UPSTREAM: http://keycloak:8080
    ports:
      - "4200:80"
    depends_on:
      - gateway
      - keycloak
    networks:
      - itinerarios-net
