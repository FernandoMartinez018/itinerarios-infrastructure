AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Microservicios del Sistema de Itinerarios en ECS Fargate (paso 27, secciones 55, 85 y 88).
  Un servicio por microservicio + RabbitMQ y Redis como contenedores (ADR-017: Amazon MQ
  minimo ~USD 100/mes). Descubrimiento por Cloud Map DNS privado. Sin NAT ni ALB: tareas
  con IP publica solo para salir a ECR/API Colombia; unicamente el Gateway acepta trafico
  externo, solo desde AdminCidr. Paso 32: + frontend, Keycloak, Prometheus, Grafana y Jaeger para la demo.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  NetworkStackName:
    Type: String
    Default: itinerarios-network
  RdsStackName:
    Type: String
    Default: itinerarios-rds
  ImageTag:
    Type: String
    Default: latest
    Description: Tag de las imagenes en ECR (SHA corto inmutable, o latest para pruebas).
  AdminCidr:
    Type: String
    Description: Rango /29-/32 autorizado a llamar al Gateway (seccion 57, nunca 0.0.0.0/0).
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(29|30|31|32)$'
  AdminCidr2:
    Type: String
    Default: ''
    Description: Opcional. Segundo rango admin (dos enlaces/ISP de salida balanceados).
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/(29|30|31|32)$'
  ColombiaApiBaseUrl:
    Type: String
    Default: https://api-colombia.com/api/v1

Conditions:
  HasAdminCidr2: !Not [!Equals [!Ref AdminCidr2, '']]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 1

  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: itinerarios.local
      Vpc: !ImportValue { 'Fn::Sub': '${NetworkStackName}-VpcId' }

  GatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Acceso de demo/entrega (paso 32) a frontend, Gateway, Swagger, Keycloak, Grafana, Prometheus y Jaeger.
        must:
          - Solo desde AdminCidr/AdminCidr2; nunca 0.0.0.0/0 (seccion 57).
    Properties:
      GroupDescription: Demo - UI y herramientas restringidas a las IPs del admin
      VpcId: !ImportValue { 'Fn::Sub': '${NetworkStackName}-VpcId' }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AdminCidr
          Description: Frontend (admin)
        - !If
          - HasAdminCidr2
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: !Ref AdminCidr2
            Description: Frontend (admin, segundo enlace)
          - !Ref AWS::NoValue
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref AdminCidr
          Description: Grafana (admin)
        - !If
          - HasAdminCidr2
          - IpProtocol: tcp
            FromPort: 3000
            ToPort: 3000
            CidrIp: !Ref AdminCidr2
            Description: Grafana (admin, segundo enlace)
          - !Ref AWS::NoValue
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8083
          CidrIp: !Ref AdminCidr
          Description: Gateway/Keycloak/Swagger (admin)
        - !If
          - HasAdminCidr2
          - IpProtocol: tcp
            FromPort: 8080
            ToPort: 8083
            CidrIp: !Ref AdminCidr2
            Description: Gateway/Keycloak/Swagger (admin, segundo enlace)
          - !Ref AWS::NoValue
        - IpProtocol: tcp
          FromPort: 9090
          ToPort: 9090
          CidrIp: !Ref AdminCidr
          Description: Prometheus (admin)
        - !If
          - HasAdminCidr2
          - IpProtocol: tcp
            FromPort: 9090
            ToPort: 9090
            CidrIp: !Ref AdminCidr2
            Description: Prometheus (admin, segundo enlace)
          - !Ref AWS::NoValue
        - IpProtocol: tcp
          FromPort: 16686
          ToPort: 16686
          CidrIp: !Ref AdminCidr
          Description: Jaeger UI (admin)
        - !If
          - HasAdminCidr2
          - IpProtocol: tcp
            FromPort: 16686
            ToPort: 16686
            CidrIp: !Ref AdminCidr2
            Description: Jaeger UI (admin, segundo enlace)
          - !Ref AWS::NoValue

  ExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: ECS agent - pull de ECR, logs y lectura de los SecureString de /itinerarios/*.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: read-itinerarios-params
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/*'

  # ---------- Infraestructura de mensajeria y cache (contenedores) ----------
  RabbitTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-rabbitmq'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: rabbitmq
          Image: public.ecr.aws/docker/library/rabbitmq:4-management-alpine
          PortMappings: [{ ContainerPort: 5672 }]
          Environment:
            - { Name: RABBITMQ_DEFAULT_USER, Value: itinerarios }
          Secrets:
            - { Name: RABBITMQ_DEFAULT_PASS, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/rabbitmq/password' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  RedisTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-redis'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: redis
          Image: public.ecr.aws/docker/library/redis:7-alpine
          PortMappings: [{ ContainerPort: 6379 }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ---------- Keycloak (seguridad S2S, paso 31) en modo produccion ----------
  # start (no start-dev) con PostgreSQL en RDS (keycloak_db). Sin volumenes en Fargate: el realm llega
  # por SSM (/itinerarios/keycloak/realm, String sin secretos) y se escribe al arrancar; los secretos de
  # los clientes son placeholders ${...} resueltos desde SecureString. Sin ingreso externo: solo la VPC.
  KeycloakTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-keycloak'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: keycloak
          Image: quay.io/keycloak/keycloak:26.7.4
          PortMappings: [{ ContainerPort: 8080 }]
          EntryPoint: ['/bin/bash', '-c']
          Command:
            - 'mkdir -p /opt/keycloak/data/import && printf "%s" "$REALM_JSON" > /opt/keycloak/data/import/itinerarios-realm.json && exec /opt/keycloak/bin/kc.sh start --import-realm'
          Environment:
            - { Name: KC_DB, Value: postgres }
            - Name: KC_DB_URL
              Value: !Sub
                - 'jdbc:postgresql://${Host}:5432/keycloak_db'
                - Host: !ImportValue { 'Fn::Sub': '${RdsStackName}-Endpoint' }
            - { Name: KC_DB_USERNAME, Value: keycloak_user }
            # Hostname dinamico: los servicios piden tokens a keycloak.itinerarios.local (iss igual al
            # que validan) y la consola responde por la IP publica de la demo. Sin TLS: solo demo.
            - { Name: KC_HOSTNAME_STRICT, Value: 'false' }
            - { Name: KC_HTTP_ENABLED, Value: 'true' }
            - { Name: KC_HEALTH_ENABLED, Value: 'true' }
            - { Name: KC_BOOTSTRAP_ADMIN_USERNAME, Value: admin }
          Secrets:
            - { Name: KC_DB_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/db/keycloak_password' }
            - { Name: KC_BOOTSTRAP_ADMIN_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/keycloak/admin_password' }
            - { Name: GATEWAY_CLIENT_SECRET, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/oauth2/gateway_secret' }
            - { Name: ITINERARY_CLIENT_SECRET, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/oauth2/itinerary_secret' }
            - { Name: REALM_JSON, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/keycloak/realm' }
            - { Name: TEST_USER_EMAIL, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/keycloak/test_user_email' }
            - { Name: TEST_USER_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/keycloak/test_user_password' }
            - { Name: TEST_USER_FIRST_NAME, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/keycloak/test_user_first_name' }
            - { Name: E2E_USER_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/keycloak/e2e_user_password' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ---------- Microservicios ----------
  AirportTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-airport'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: airport-service
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/itinerarios-airport-service:${ImageTag}'
          PortMappings: [{ ContainerPort: 8081 }]
          Environment:
            - { Name: SPRING_PROFILES_ACTIVE, Value: prod }
            - { Name: JAVA_TOOL_OPTIONS, Value: '-javaagent:/app/opentelemetry-javaagent.jar' }
            - { Name: OTEL_SERVICE_NAME, Value: airport-service }
            - { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: 'http://jaeger.itinerarios.local:4317' }
            - { Name: OTEL_EXPORTER_OTLP_PROTOCOL, Value: grpc }
            - { Name: OTEL_METRICS_EXPORTER, Value: none }
            - { Name: OTEL_LOGS_EXPORTER, Value: none }
            - { Name: OAUTH2_ISSUER_URI, Value: 'http://keycloak.itinerarios.local:8080/realms/itinerarios' }
            - { Name: DB_HOST, Value: !ImportValue { 'Fn::Sub': '${RdsStackName}-Endpoint' } }
            - { Name: DB_PORT, Value: '5432' }
            - { Name: DB_NAME, Value: airport_db }
            - { Name: DB_USERNAME, Value: airport_user }
            - { Name: REDIS_HOST, Value: redis.itinerarios.local }
            - { Name: COLOMBIA_API_BASE_URL, Value: !Ref ColombiaApiBaseUrl }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/db/airport_password' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  ItineraryTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-itinerary'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: itinerary-service
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/itinerarios-itinerary-service:${ImageTag}'
          PortMappings: [{ ContainerPort: 8082 }]
          Environment:
            - { Name: SPRING_PROFILES_ACTIVE, Value: prod }
            - { Name: JAVA_TOOL_OPTIONS, Value: '-javaagent:/app/opentelemetry-javaagent.jar' }
            - { Name: OTEL_SERVICE_NAME, Value: itinerary-service }
            - { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: 'http://jaeger.itinerarios.local:4317' }
            - { Name: OTEL_EXPORTER_OTLP_PROTOCOL, Value: grpc }
            - { Name: OTEL_METRICS_EXPORTER, Value: none }
            - { Name: OTEL_LOGS_EXPORTER, Value: none }
            - { Name: OAUTH2_ISSUER_URI, Value: 'http://keycloak.itinerarios.local:8080/realms/itinerarios' }
            - { Name: OAUTH2_TOKEN_URI, Value: 'http://keycloak.itinerarios.local:8080/realms/itinerarios/protocol/openid-connect/token' }
            - { Name: DB_HOST, Value: !ImportValue { 'Fn::Sub': '${RdsStackName}-Endpoint' } }
            - { Name: DB_PORT, Value: '5432' }
            - { Name: DB_NAME, Value: itinerary_db }
            - { Name: DB_USERNAME, Value: itinerary_user }
            - { Name: AIRPORT_SERVICE_URL, Value: 'http://airport.itinerarios.local:8081' }
            - { Name: RABBITMQ_HOST, Value: rabbitmq.itinerarios.local }
            - { Name: RABBITMQ_USERNAME, Value: itinerarios }
          Secrets:
            - { Name: OAUTH2_CLIENT_SECRET, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/oauth2/itinerary_secret' }
            - { Name: DB_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/db/itinerary_password' }
            - { Name: RABBITMQ_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/rabbitmq/password' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  NotificationTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-notification'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: notification-service
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/itinerarios-notification:${ImageTag}'
          PortMappings: [{ ContainerPort: 8083 }]
          Environment:
            - { Name: SPRING_PROFILES_ACTIVE, Value: prod }
            - { Name: JAVA_TOOL_OPTIONS, Value: '-javaagent:/app/opentelemetry-javaagent.jar' }
            - { Name: OTEL_SERVICE_NAME, Value: notification-service }
            - { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: 'http://jaeger.itinerarios.local:4317' }
            - { Name: OTEL_EXPORTER_OTLP_PROTOCOL, Value: grpc }
            - { Name: OTEL_METRICS_EXPORTER, Value: none }
            - { Name: OTEL_LOGS_EXPORTER, Value: none }
            - { Name: OAUTH2_ISSUER_URI, Value: 'http://keycloak.itinerarios.local:8080/realms/itinerarios' }
            - { Name: DB_HOST, Value: !ImportValue { 'Fn::Sub': '${RdsStackName}-Endpoint' } }
            - { Name: DB_PORT, Value: '5432' }
            - { Name: DB_NAME, Value: notification_db }
            - { Name: DB_USERNAME, Value: notification_user }
            - { Name: RABBITMQ_HOST, Value: rabbitmq.itinerarios.local }
            - { Name: RABBITMQ_USERNAME, Value: itinerarios }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/db/notification_password' }
            - { Name: RABBITMQ_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/rabbitmq/password' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  GatewayTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-gateway'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: gateway
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/itinerarios-gateway:${ImageTag}'
          PortMappings: [{ ContainerPort: 8080 }]
          Environment:
            - { Name: AIRPORT_SERVICE_URL, Value: 'http://airport.itinerarios.local:8081' }
            - { Name: JAVA_TOOL_OPTIONS, Value: '-javaagent:/app/opentelemetry-javaagent.jar' }
            - { Name: OTEL_SERVICE_NAME, Value: gateway }
            - { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: 'http://jaeger.itinerarios.local:4317' }
            - { Name: OTEL_EXPORTER_OTLP_PROTOCOL, Value: grpc }
            - { Name: OTEL_METRICS_EXPORTER, Value: none }
            - { Name: OTEL_LOGS_EXPORTER, Value: none }
            - { Name: ITINERARY_SERVICE_URL, Value: 'http://itinerary.itinerarios.local:8082' }
            - { Name: NOTIFICATION_SERVICE_URL, Value: 'http://notification.itinerarios.local:8083' }
            - { Name: OAUTH2_TOKEN_URI, Value: 'http://keycloak.itinerarios.local:8080/realms/itinerarios/protocol/openid-connect/token' }
            - { Name: KEYCLOAK_INTERNAL_URL, Value: 'http://keycloak.itinerarios.local:8080' }
          Secrets:
            - { Name: OAUTH2_CLIENT_SECRET, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/oauth2/gateway_secret' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ---------- Frontend y observabilidad (paso 32: entrega con URLs) ----------
  FrontendTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-frontend'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/itinerarios-frontend:${ImageTag}'
          PortMappings: [{ ContainerPort: 80 }]
          Environment:
            # nginx: /api, login y logout -> Gateway; /realms -> Keycloak (mismo origen, ADR-018). Resolver de la VPC para Cloud Map.
            - { Name: GATEWAY_UPSTREAM, Value: 'http://gateway.itinerarios.local:8080' }
            - { Name: NGINX_RESOLVER, Value: 169.254.169.253 }
            - { Name: KEYCLOAK_UPSTREAM, Value: 'http://keycloak.itinerarios.local:8080' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  JaegerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-jaeger'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: jaeger
          # Recibe OTLP directo de los agentes (sin otel-collector en AWS: un contenedor menos).
          Image: jaegertracing/all-in-one:1.76.0
          PortMappings: [{ ContainerPort: 16686 }, { ContainerPort: 4317 }]
          Environment:
            - { Name: COLLECTOR_OTLP_ENABLED, Value: 'true' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  PrometheusTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-prometheus'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: prometheus
          Image: prom/prometheus:v3.0.1
          PortMappings: [{ ContainerPort: 9090 }]
          # Sin volumenes en Fargate: config y reglas llegan por SSM y se escriben al arrancar.
          # SSM no admite "{{" en valores: el script los sube como <% %> y sed los restaura.
          EntryPoint: ['/bin/sh', '-c']
          Command:
            - 'mkdir -p /tmp/prom && printf "%s" "$PROM_CONFIG" > /tmp/prom/prometheus.yml && printf "%s" "$ALERT_RULES" | sed "s/<%/{{/g; s/%>/}}/g" > /tmp/prom/alert-rules.yml && exec /bin/prometheus --config.file=/tmp/prom/prometheus.yml --storage.tsdb.path=/prometheus'
          Secrets:
            - { Name: PROM_CONFIG, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/observability/prometheus_yml' }
            - { Name: ALERT_RULES, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/observability/alert_rules' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  GrafanaTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-grafana'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: grafana
          Image: grafana/grafana:11.4.0
          PortMappings: [{ ContainerPort: 3000 }]
          EntryPoint: ['/bin/sh', '-c']
          Command:
            - 'mkdir -p /tmp/prov/datasources /tmp/prov/dashboards /tmp/dashboards && printf "%s" "$GRAFANA_DS" > /tmp/prov/datasources/ds.yaml && printf "%s" "$GRAFANA_PROVIDER" > /tmp/prov/dashboards/provider.yaml && printf "%s" "$GRAFANA_DASHBOARD" | sed "s/<%/{{/g; s/%>/}}/g" > /tmp/dashboards/itinerarios-overview.json && exec /run.sh'
          Environment:
            - { Name: GF_PATHS_PROVISIONING, Value: /tmp/prov }
            - { Name: GF_SECURITY_ADMIN_USER, Value: admin }
            # Solo lectura sin login para los evaluadores (el SG ya limita el acceso a las IPs del admin).
            - { Name: GF_AUTH_ANONYMOUS_ENABLED, Value: 'true' }
            - { Name: GF_AUTH_ANONYMOUS_ORG_ROLE, Value: Viewer }
          Secrets:
            - { Name: GF_SECURITY_ADMIN_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/grafana/admin_password' }
            - { Name: GRAFANA_DS, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/observability/grafana_datasources' }
            - { Name: GRAFANA_PROVIDER, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/observability/grafana_dashboards' }
            - { Name: GRAFANA_DASHBOARD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/itinerarios/observability/grafana_dashboard_json' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ---------- Servicios ECS (1 tarea c/u) + registro DNS ----------
  RabbitDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: rabbitmq
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }] }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  RedisDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: redis
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }] }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  AirportDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: airport
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }] }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  ItineraryDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: itinerary
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }] }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  KeycloakDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: keycloak
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }] }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  NotificationDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: notification
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }] }
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  GatewayDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: gateway
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }] }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  JaegerDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: jaeger
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }] }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  PrometheusDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: prometheus
      NamespaceId: !Ref Namespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }] }
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  RabbitService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref RabbitTask
      ServiceRegistries: [{ RegistryArn: !GetAtt RabbitDiscovery.Arn }]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED   # sin NAT: salida a ECR por IP publica; SG sin ingreso externo
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups: [!ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }]
  RedisService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref RedisTask
      ServiceRegistries: [{ RegistryArn: !GetAtt RedisDiscovery.Arn }]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED   # sin NAT: salida a ECR por IP publica; SG sin ingreso externo
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups: [!ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }]
  AirportService:
    Type: AWS::ECS::Service
    DependsOn: RedisService
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref AirportTask
      ServiceRegistries: [{ RegistryArn: !GetAtt AirportDiscovery.Arn }]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED   # sin NAT: salida a ECR por IP publica; SG sin ingreso externo
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }
            - !Ref GatewaySecurityGroup
  ItineraryService:
    Type: AWS::ECS::Service
    DependsOn: [RabbitService, AirportService]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref ItineraryTask
      ServiceRegistries: [{ RegistryArn: !GetAtt ItineraryDiscovery.Arn }]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED   # sin NAT: salida a ECR por IP publica; SG sin ingreso externo
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }
            - !Ref GatewaySecurityGroup
  NotificationService:
    Type: AWS::ECS::Service
    DependsOn: RabbitService
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref NotificationTask
      ServiceRegistries: [{ RegistryArn: !GetAtt NotificationDiscovery.Arn }]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED   # sin NAT: salida a ECR por IP publica; SG sin ingreso externo
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }
            - !Ref GatewaySecurityGroup
  KeycloakService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref KeycloakTask
      ServiceRegistries: [{ RegistryArn: !GetAtt KeycloakDiscovery.Arn }]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED   # sin NAT: salida a quay.io por IP publica; SG sin ingreso externo
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }
            - !Ref GatewaySecurityGroup
  GatewayService:
    Type: AWS::ECS::Service
    DependsOn: [AirportService, ItineraryService, NotificationService, KeycloakService]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref GatewayTask
      ServiceRegistries: [{ RegistryArn: !GetAtt GatewayDiscovery.Arn }]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }
            - !Ref GatewaySecurityGroup

  JaegerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref JaegerTask
      ServiceRegistries: [{ RegistryArn: !GetAtt JaegerDiscovery.Arn }]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }
            - !Ref GatewaySecurityGroup
  PrometheusService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref PrometheusTask
      ServiceRegistries: [{ RegistryArn: !GetAtt PrometheusDiscovery.Arn }]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }
            - !Ref GatewaySecurityGroup
  GrafanaService:
    Type: AWS::ECS::Service
    DependsOn: PrometheusService
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref GrafanaTask
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }
            - !Ref GatewaySecurityGroup
  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: GatewayService
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref FrontendTask
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${NetworkStackName}-PublicSubnetIds' }]
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${NetworkStackName}-AppSecurityGroupId' }
            - !Ref GatewaySecurityGroup

Outputs:
  ClusterName:
    Value: !Ref Cluster
  LogGroupName:
    Value: !Ref LogGroup
