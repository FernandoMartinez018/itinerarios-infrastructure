AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Red base del Sistema de Itinerarios (paso 25, seccion 85 punto 3). VPC con 2 subredes
  publicas en 2 AZ (RDS exige subnet group multi-AZ) y SIN NAT Gateway (~USD 32/mes):
  las tareas Fargate usaran IP publica. Grupos de seguridad sin ingreso 0.0.0.0/0 a datos.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  AdminCidr:
    Type: String
    Default: ''
    Description: >
      Opcional. Rango /29-/32 del administrador (redes con pool de IPs de salida) para pruebas temporales contra RDS (seccion 57:
      nunca 0.0.0.0/0). Vacio = sin acceso externo. Quitarlo al terminar la prueba.
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/(29|30|31|32)$'

  AdminCidr2:
    Type: String
    Default: ''
    Description: Opcional. Segundo rango admin (redes con dos enlaces/ISP de salida balanceados).
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/(29|30|31|32)$'

Conditions:
  HasAdminCidr: !Not [!Equals [!Ref AdminCidr, '']]
  HasAdminCidr2: !Not [!Equals [!Ref AdminCidr2, '']]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-vpc' }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-a' }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-b' }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  SubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Grupo de las tareas ECS de los microservicios; origen autorizado hacia RDS y el broker.
    Properties:
      GroupDescription: Microservicios (ECS) del sistema de itinerarios
      VpcId: !Ref Vpc

  AppSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      SourceSecurityGroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      Description: Trafico entre microservicios (HTTP, RabbitMQ, Redis)

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Firewall de RDS (seccion 57).
        must:
          - No permitir 5432 desde 0.0.0.0/0; solo desde AppSecurityGroup y, temporalmente, AdminCidr /32.
    Properties:
      GroupDescription: PostgreSQL RDS - solo microservicios y admin temporal
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Microservicios
        - !If
          - HasAdminCidr
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: !Ref AdminCidr
            Description: Admin temporal (pruebas)
          - !Ref AWS::NoValue
        - !If
          - HasAdminCidr2
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: !Ref AdminCidr2
            Description: Admin temporal (pruebas, segundo enlace)
          - !Ref AWS::NoValue

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub '${AWS::StackName}-VpcId' }
  PublicSubnetIds:
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: !Sub '${AWS::StackName}-PublicSubnetIds' }
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
    Export: { Name: !Sub '${AWS::StackName}-AppSecurityGroupId' }
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
    Export: { Name: !Sub '${AWS::StackName}-DatabaseSecurityGroupId' }
